<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="ctn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="ctn-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9" />
    </linearGradient>
    <filter id="ctn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0B132B" stroke="#1E293B" stroke-width="2" />

  <!-- Outer Geometric C Monogram Arc -->
  <path
    d="M86 36 C76 26, 44 26, 34 40 C22 56, 22 76, 34 92 C44 104, 76 104, 88 92"
    stroke="url(#ctn-grad)"
    stroke-width="12"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Digital Wallet Card Base Inside C -->
  <rect x="52" y="48" width="46" height="32" rx="6" fill="url(#ctn-card)" opacity="0.3" stroke="url(#ctn-grad)" stroke-width="3" />

  <!-- Telecom Pulse / Connectivity Signal Wave -->
  <path
    d="M48 64 L58 64 L64 54 L72 74 L78 61 L84 64 L96 64"
    stroke="#00E5FF"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#ctn-glow)"
  />

  <!-- Glowing Signal Node -->
  <circle cx="96" cy="64" r="3" fill="#FFFFFF" />
</svg>
